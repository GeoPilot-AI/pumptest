[project]
name = "pumptest"
version = "0.1.0"
description = "Pumping test and aquifer test analysis: Theis, Cooper-Jacob, Hantush, Papadopulos-Cooper, Neuman, recovery and step-drawdown, validated against published AQTESOLV fits."
readme = "README.md"
authors = [
    { name = "Jagadeesh Gaddam", email = "jagadeesh@smartbhujal.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hydrogeology", "pumping test", "aquifer test", "groundwater", "theis", "neuman", "hantush"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/GeoPilot-AI/pumptest"
Repository = "https://github.com/GeoPilot-AI/pumptest"
Issues = "https://github.com/GeoPilot-AI/pumptest/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3", "pip-licenses>=5"]
docs = ["mkdocs>=1.6"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------- house rules
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Without these two, an unannotated function passes the types gate silently.
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not network'"
markers = [
    "network: test reaches a live external service; skipped by default in CI",
]
